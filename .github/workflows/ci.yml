name: ARENA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://jpdjwcxlxvlgqgbresae.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6XJH0Tklv29MbqKjtI_G_w_WCvUrEPu
      NEXT_PUBLIC_APP_URL: https://arena.vercel.app
      ENABLE_DEMO_MODE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit lockfile when missing
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git ls-files --others --exclude-standard package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock dependency versions"
            git push
          fi

      - name: Run tests
        run: npm test

      - name: Build Next.js
        run: npm run build
